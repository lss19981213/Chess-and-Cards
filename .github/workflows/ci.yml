name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 代码规范检查
        run: pnpm lint

      - name: 类型检查
        run: pnpm typecheck

      - name: 构建前端
        run: pnpm build

      - name: 游戏规则冒烟（13 款全部过一遍）
        run: pnpm --filter @cc/room-server exec tsx scripts/game-smoke.ts
