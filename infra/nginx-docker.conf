server {
    listen 80;
    server_name _;
    absolute_redirect off;

    client_max_body_size 12m;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    # 根路径自动跳转到棋牌大厅
    location = / {
        return 302 /lobby/;
    }

    location = /968412825cef4799a116b17b6025c2c2.txt {
        default_type text/plain;
        return 200 "968412825cef4799a116b17b6025c2c2";
    }

    location = /baidu_verify_codeva-Ddkll6BrMh.html {
        default_type text/html;
        return 200 "774c636f2313c3a8ca949b667dad80e4";
    }

    # 健康检查
    location = /health {
        proxy_pass http://api-server:8080/health;
    }

    # 停服维护友好页（彻底告别生硬 502/503/504 报错）
    error_page 502 503 504 /lobby/maintenance.html;

    location = /lobby/maintenance.html {
        alias /usr/share/nginx/html/lobby/maintenance.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    location @api_maintenance {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 503 '{"error":"平台正在紧急更新中，请耐心等待（更新完成后自动补偿 1,000 欢乐豆）","maintenance":true,"mode":"updating","compensationCoins":1000}';
    }

    # 1. 根路径直连代理（供 GM 客户端、探活及自动化脚本直连）
    location /api/ {
        proxy_pass http://api-server:8080/api/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_intercept_errors on;
        error_page 502 503 504 =503 @api_maintenance;

        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options SAMEORIGIN always;
    }

    location = /ws {
        proxy_pass http://room-server:9000/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 2. Web 大厅子路径 API & WebSocket 代理
    location /lobby/api/ {
        proxy_pass http://api-server:8080/api/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_intercept_errors on;
        error_page 502 503 504 =503 @api_maintenance;

        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options SAMEORIGIN always;
    }

    location = /lobby/ws {
        proxy_pass http://room-server:9000/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 3. 音乐资源允许随时热替换，不强锁 immutable 1年缓存
    location /lobby/assets/music/ {
        alias /usr/share/nginx/html/lobby/assets/music/;
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options nosniff always;
        access_log off;
    }

    # 4. 其余带内容哈希的静态资源长期强缓存
    location /lobby/assets/ {
        alias /usr/share/nginx/html/lobby/assets/;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        access_log off;
    }

    # 4. 大厅 SPA 入口
    location /lobby/ {
        alias /usr/share/nginx/html/lobby/;
        index index.html;
        try_files $uri $uri/ /lobby/index.html;
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self' data:; connect-src 'self' ws: wss:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
    }
}
