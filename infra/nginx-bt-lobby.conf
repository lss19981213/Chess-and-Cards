# 宝塔面板（BT Panel）专用站点片段
# 宝塔主配置的 server 块是 "server" 与 "{" 分行书写，无法用 sed 注入 include，
# 因此单独放一个 default_server，把 /lobby/ 挂到公网 80 端口。
# deploy.sh 检测到宝塔环境时会自动安装到 /www/server/panel/vhost/nginx/cc-lobby.conf
server {
    listen 80 default_server;
    server_name _;

    include /etc/nginx/snippets/lobby.conf;

    location / {
        return 404;
    }
}
