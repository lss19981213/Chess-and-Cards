# 棋牌大厅站点片段，由 deploy.sh 以 include 方式注入主站 server 块。
# 部署在 /lobby/ 子路径，不占用独立端口，也不影响同机其他站点。

location /lobby/api/ {
    proxy_pass http://127.0.0.1:8080/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
}

location = /lobby/ws {
    proxy_pass http://127.0.0.1:9000/ws;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

location /lobby/assets/ {
    alias /opt/chess-and-cards/apps/lobby-web/dist/assets/;
    expires 30d;
    add_header Cache-Control "public, immutable";
}

location /lobby/ {
    alias /opt/chess-and-cards/apps/lobby-web/dist/;
    index index.html;
    try_files $uri $uri/ /lobby/index.html;
}
