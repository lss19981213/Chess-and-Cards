# 棋牌大厅站点片段，由 deploy.sh 以 include 方式注入主站 server 块。
# 部署在 /lobby/ 子路径，不占用独立端口，也不影响同机其他站点。
#
# 说明：HTTPS/HSTS 由外层 server 块负责。如果这是独立站点，请确保
# 443 配置里包含 strict-transport-security，并把 80 端口 301 到 443。

# 1. 根路径直连代理（供 GM 运营管理中台、自动化脚本与健康探活直连）
location /api/ {
    proxy_pass http://127.0.0.1:8080/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
}

location = /ws {
    proxy_pass http://127.0.0.1:9000/ws;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    add_header X-Content-Type-Options nosniff always;
}

# 2. Web 站点子路径代理（供 Web 大厅与内置游戏访问）
location /lobby/api/ {
    proxy_pass http://127.0.0.1:8080/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # 后端以 trustProxy=127.0.0.1 解析真实来源，这里追加即可
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
}

location = /lobby/ws {
    proxy_pass http://127.0.0.1:9000/ws;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    add_header X-Content-Type-Options nosniff always;
}

location /lobby/assets/ {
    alias /opt/chess-and-cards/apps/lobby-web/dist/assets/;
    # 文件名带内容哈希，可安全长期缓存
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options nosniff always;
    access_log off;
}

location /lobby/ {
    alias /opt/chess-and-cards/apps/lobby-web/dist/;
    index index.html;
    try_files $uri $uri/ /lobby/index.html;
    # 入口 HTML 不缓存：否则发版后浏览器仍加载旧 HTML 指向旧 JS
    add_header Cache-Control "no-cache, must-revalidate" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    # 页面不引用任何第三方脚本；头像用 data: URL，样式用内联 style 属性
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self' data:; connect-src 'self' ws: wss:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
}
